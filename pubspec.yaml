name: multiplicado
description: "Multiplicado — recepção e integração de visitantes em células."
publish_to: 'none'

version: 0.1.10+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Maps & Geolocation
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_map_marker_popup: ^8.1.1

  # Forms & Validation
  mask_text_input_formatter: ^2.9.0

  # Utils
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.1.3
  logger: ^2.5.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  # Notificação em primeiro plano na web (Notification API).
  web: ^1.1.1
  file_picker: ^8.1.4
  open_filex: ^4.5.1
  image_cropper: ^12.2.1
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.69.0

  # Export (PDF / Excel)
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6

  # Notifications
  flutter_local_notifications: ^17.2.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.1.7
  qr_flutter: ^4.1.0

  # Rich text & video
  flutter_quill: ^11.5.0
  youtube_player_iframe: ^5.2.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    # Empacotadas de propósito: antes vinham do google_fonts em tempo de
    # execução, o que custava um round-trip ao fonts.gstatic.com por
    # família+peso DEPOIS do boot — texto só aparecia no fim disso.
    # Instâncias estáticas com subset latino (acentuação pt-BR).
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#4A6FA5"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
