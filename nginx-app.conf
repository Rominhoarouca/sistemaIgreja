server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker — must never be cached (browser would serve stale SW)
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Flutter bootstrap — no cache
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # index.html — no cache so the app always fetches the latest version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # PWA manifest — short cache
    location = /manifest.json {
        add_header Cache-Control "max-age=3600";
        try_files $uri =404;
    }

    # Static assets (JS, CSS, fonts, images, WASM) — 1 year immutable
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all unmatched routes serve index.html (GoRouter / History API)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
