name: Publish Flutter Web App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. 0.1.0)'
        required: false
      api_base_url:
        description: 'API base url used at build time'
        required: false
        default: 'https://api.example.com/v1'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Determine TAG and API_BASE_URL
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            echo "API_BASE_URL=${{ github.event.inputs.api_base_url }}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
            echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Build Flutter web
        run: flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Precompress web assets
        run: |
          chmod +x ./scripts/precompress_web.sh || true
          ./scripts/precompress_web.sh build/web

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sistema-igreja-app:${{ env.TAG }}
          no-cache: true

      - name: Log published image
        run: echo "Published image: ${{ secrets.DOCKERHUB_USERNAME }}/sistema-igreja-app:${{ env.TAG }}"
