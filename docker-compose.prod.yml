# Stack de produção.
#
# Diferenças em relação ao docker-compose.yml (desenvolvimento): imagens
# publicadas em vez de build local, credencial do Firebase entregue como
# secret, e as portas de administração fechadas para fora da máquina.
#
# Sobe com:
#   docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema_igreja_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_igreja
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Só o host. A API fala com o banco pela rede interna do compose, então
      # publicar 5432 para fora só serviria para expor o Postgres à internet.
      # Para acessar de fora: `ssh -L 5432:localhost:5432 usuario@servidor`.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d sistema_igreja']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistema_igreja_net

  nginx:
    image: nginx:alpine
    container_name: sistema_igreja_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - app
      - minio
      - landing
    networks:
      - sistema_igreja_net

  app:
    image: rominhoarouca/sistema-igreja-app:0.1.11
    container_name: sistema_igreja_app
    restart: unless-stopped
    environment:
      # Substituído em runtime pelo entrypoint.sh da imagem, não no build.
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - sistema_igreja_net

  api:
    image: rominhoarouca/sistema-igreja-api:0.1.11
    container_name: sistema_igreja_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_URL}/sistema_igreja
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: 'false'
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      # Base pública da própria API. A arte do push (sirene/alerta) é baixada
      # pelo sistema operacional do aparelho antes de o app abrir, então a URL
      # precisa ser alcançável de fora. Sem ela o push chega sem imagem.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Caminho, não o JSON: o FcmSender aceita os dois, e o arquivo mantém a
      # chave fora de `docker inspect` e de qualquer dump de process.env.
      # Sem esta variável a API sobe igual — só o push fica desativado.
      FIREBASE_SERVICE_ACCOUNT: /run/secrets/firebase_sa
    secrets:
      - firebase_sa
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - sistema_igreja_net

  minio:
    image: minio/minio:latest
    container_name: sistema_igreja_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9000 já é servido ao público pelo nginx em /storage/, e 9001 é o
      # console de administração — nenhum dos dois precisa de porta aberta.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - sistema_igreja_net
    healthcheck:
      # localhost, não MINIO_PUBLIC_URL: o teste roda dentro do container e
      # precisa checar o próprio processo. Apontado para a URL pública, ele
      # sai pela rede e volta, e passa a medir o nginx e o DNS externo em vez
      # do MinIO — falha em rede isolada e mascara MinIO morto atrás de proxy.
      test:
        ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  landing:
    image: rominhoarouca/sistema-igreja-landing:0.1.10
    container_name: sistema_igreja_landing
    restart: unless-stopped
    networks:
      - sistema_igreja_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sistema_igreja_pgadmin
    restart: unless-stopped
    ports:
      - '127.0.0.1:5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sistema_igreja_net
    profiles:
      - tools

networks:
  sistema_igreja_net:
    driver: bridge

volumes:
  postgres_data:
  uploads:
  minio_data:
  pgadmin_data:

secrets:
  # Service account do Firebase Admin. Assina como administrador do projeto e
  # envia push em nome dele — mantenha fora do repositório (o .gitignore já
  # cobre `*firebase-adminsdk*.json`) e com permissão 600.
  #
  #   mkdir -p secrets && chmod 700 secrets
  #   cp multiplicado-a36cf-firebase-adminsdk-*.json secrets/firebase-adminsdk.json
  #   chmod 600 secrets/firebase-adminsdk.json
  firebase_sa:
    file: ./secrets/firebase-adminsdk.json

configs:
  nginx_conf:
    content: |
      upstream api_backend {
        server api:3000;
      }

      upstream app_frontend {
        server app:80;
      }

      upstream landing_frontend {
        server landing:80;
      }

      server {
        listen 80;
        server_name _;

        location /v1/ {
          proxy_pass         http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header   Host              $$host;
          proxy_set_header   X-Real-IP         $$remote_addr;
          proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $$scheme;
          proxy_connect_timeout 60s;
          proxy_send_timeout    60s;
          proxy_read_timeout    60s;
        }

        location /docs {
          proxy_pass         http://api_backend;
          proxy_http_version 1.1;
          proxy_set_header   Host              $$host;
          proxy_set_header   X-Real-IP         $$remote_addr;
          proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $$scheme;
        }

        location /health {
          access_log off;
          proxy_pass         http://api_backend/health;
          proxy_set_header   X-Forwarded-Proto $$scheme;
        }

        location /storage/ {
          proxy_pass         http://minio:9000/;
          proxy_http_version 1.1;
          proxy_set_header   Host            minio:9000;
          proxy_set_header   X-Real-IP       $$remote_addr;
          proxy_set_header   X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_connect_timeout 60s;
          proxy_send_timeout    120s;
          proxy_read_timeout    120s;
        }
        # ── Landing Page ─────────────────────────────────────────────────────
        # /site sem barra final → redireciona para /site/ (senão os assets
        # relativos resolvem contra / e caem no PWA).
        location = /site {
          return 301 /site/;
        }

        # Barra final no proxy_pass remove o prefixo /site/ antes de repassar:
        # /site/logo.png → landing recebe /logo.png.
        location /site/ {
          proxy_pass         http://landing_frontend/;
          proxy_http_version 1.1;
          proxy_set_header   Host              $$host;
          proxy_set_header   X-Real-IP         $$remote_addr;
          proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $$scheme;
        }

        location / {
          proxy_pass         http://app_frontend;
          proxy_http_version 1.1;
          proxy_set_header   Host              $$host;
          proxy_set_header   X-Real-IP         $$remote_addr;
          proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $$scheme;
        }
      }
