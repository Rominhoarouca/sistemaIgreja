# Nginx reverse proxy — routes API traffic and serves Flutter Web PWA
# API:          http://HOST/v1/...   (REST endpoints)
# Swagger:      http://HOST/docs
# Health:       http://HOST/health
# Landing Page: http://HOST/site     (landing page pública)
# Storage:      http://HOST/storage/ (MinIO files)
# Flutter PWA:  http://HOST/         (app web)

upstream api_backend {
  server api:3000;
}

upstream app_frontend {
  server app:80;
}

upstream landing_frontend {
  server landing:80;
}

server {
  listen 80;
  server_name _;

  # Performance tuning
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # ── API — REST endpoints ──────────────────────────────────────────────
  location /v1/ {
    proxy_pass         http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # ── API — Swagger UI ─────────────────────────────────────────────────
  location /docs {
    proxy_pass         http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── API — Health check ───────────────────────────────────────────────
  location /health {
    access_log off;
    proxy_pass         http://api_backend/health;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── MinIO — arquivos (imagens de perfil, materiais) ─────────────────
  # URLs presigned geradas pela API usam este prefixo público
  # (comentado pois MinIO não está em uso neste ambiente)
  location /storage/ {
    proxy_pass         http://minio:9000/;
    proxy_http_version 1.1;
    proxy_set_header   Host            minio:9000;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    # Aumenta timeout para downloads maiores
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
  }

  # ── Landing Page ─────────────────────────────────────────────────────
  location /site {
    proxy_pass         http://landing_frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── Flutter Web PWA ──────────────────────────────────────────────────
  location / {
    proxy_pass         http://app_frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

