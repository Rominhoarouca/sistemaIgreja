# Nginx reverse proxy configuration for Sistema Igreja API
# This handles TLS termination and routes traffic to the Node.js backend

upstream api_backend {
  server api:3000;
}

server {
  listen 80;
  server_name _;

  # Redirect HTTP to HTTPS in production
  # Uncomment in production after SSL certs are setup
  # return 301 https://$server_name$request_uri;

  # For development/HTTP-only, serve API directly
  location / {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /health {
    access_log off;
    proxy_pass http://api_backend/health;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

